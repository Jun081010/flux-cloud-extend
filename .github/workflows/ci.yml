name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Bun)
        run: bun run test

      - name: Node-native tests
        run: bun run test:node

      - name: LinkSwift patch test
        run: bun run test:cloud

      - name: Baidu page bridge test
        run: bun run test:baidu

      - name: Release package smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -File ..\scripts\test-package-release.ps1

      - name: Native bridge compatibility test (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -File ..\scripts\test-native-host-compat.ps1

      - name: Build Edge (MV3)
        run: bun run build:edge

      - name: Build Chrome (MV3)
        run: bun run build

      - name: Verify build output
        shell: pwsh
        run: |
          $expected = @(
            '.output/edge-mv3/manifest.json',
            '.output/chrome-mv3/manifest.json',
            '.output/edge-mv3/cloud/linkswift.bundle.js',
            '.output/chrome-mv3/cloud/linkswift.bundle.js'
          )
          $missing = @()
          foreach ($relative in $expected) {
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) { $missing += $relative }
          }
          if ($missing.Count -gt 0) {
            Write-Host "missing build output:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          $expectedVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          foreach ($manifestPath in @('.output/edge-mv3/manifest.json', '.output/chrome-mv3/manifest.json')) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.manifest_version -ne 3 -or $manifest.version -ne $expectedVersion) {
              throw "Unexpected manifest version in ${manifestPath}: MV$($manifest.manifest_version) $($manifest.version)"
            }
          }
          Write-Host "build output verified."
